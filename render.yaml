services:
  - type: web
    name: liveroums-arena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTICHEAT_EXPORT_TOKEN   # optionnel : active GET /api/admin/anticheat-export (Bearer) ; vide = désactivée
        sync: false
